<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title">
  <title id="title">Black heart</title>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#eadbd8"/>
      <stop offset="1" stop-color="#cbb9bb"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="38%" r="65%">
      <stop stop-color="#f8eeea" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8e7982" stop-opacity=".22"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
      <feOffset dy="28"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".34"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#paper)"/>
  <rect width="900" height="1100" fill="url(#light)"/>
  <path d="M0 835c180-75 270-40 445-4s293 35 455-26v295H0z" fill="#9a8589" opacity=".2"/>
  <path d="M450 815c-46-45-258-194-258-371 0-111 80-190 181-190 67 0 117 40 147 100 30-60 80-100 147-100 101 0 181 79 181 190 0 177-212 326-258 371-42 41-98 41-140 0z"
        fill="#111013" filter="url(#shadow)"/>
  <path d="M295 375c20-56 65-91 120-91" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".12" stroke-width="15"/>
</svg>
